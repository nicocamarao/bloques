<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tatetí Numberblocks</title>
    <link rel="stylesheet" href="../../shared/site.css">
    <link rel="stylesheet" href="../game.css">
  </head>
  <body>
    <div id="site-top"></div>
    <div class="site-shell">
      <aside id="site-sidebar" class="site-sidebar"></aside>
      <main id="site-main" class="site-main">
        <section class="game-page">
          <header class="game-hero">
            <div>
              <p class="eyebrow">Juego de tablero</p>
              <h1>Tatetí Numberblocks</h1>
              <p>Haz tres en raya con un tablero táctil y turnos claros, listo para celular.</p>
            </div>
            <div class="game-badges">
              <span class="pill" id="turn-pill">Turno: One</span>
              <span class="pill" id="score-pill">One 0 - Two 0</span>
            </div>
          </header>
          <section class="game-stage stack">
            <div class="scoreline">
              <span class="pill">One = jugador 1</span>
              <span class="pill">Two = jugador 2</span>
              <button class="game-action" id="reset-button" type="button">Reiniciar</button>
            </div>
            <div id="board" class="game-board grid-3" aria-label="Tablero de tatetí"></div>
            <div class="game-note" id="status">Toca una casilla para empezar.</div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="../../shared/site.js"></script>
    <script type="module">
      import { blockForNumber } from "../../shared/numberblocks.js";
      import { recordScore } from "../../shared/social.js";

      const board = document.getElementById("board");
      const turnPill = document.getElementById("turn-pill");
      const scorePill = document.getElementById("score-pill");
      const status = document.getElementById("status");
      const resetButton = document.getElementById("reset-button");
      const state = { cells: Array(9).fill(""), turn: "one", wins: { one: 0, two: 0 }, over: false };
      const winning = [
        [0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6],
      ];

      function winner() {
        return winning.find(([a,b,c]) => state.cells[a] && state.cells[a] === state.cells[b] && state.cells[a] === state.cells[c]);
      }

      function draw() {
        board.innerHTML = "";
        state.cells.forEach((mark, index) => {
          const button = document.createElement("button");
          button.className = "tile fill";
          button.type = "button";
          button.innerHTML = mark
            ? `<img src="${blockForNumber(mark === "one" ? 1 : 2).src}" alt="">`
            : `<span class="symbol" style="font-size:28px;color:${index % 2 ? "#7ca8ff" : "#ffd166"}">+</span>`;
          button.addEventListener("click", () => play(index));
          board.appendChild(button);
        });
        turnPill.textContent = `Turno: ${state.turn === "one" ? "One" : "Two"}`;
        scorePill.textContent = `One ${state.wins.one} - Two ${state.wins.two}`;
      }

      function play(index) {
        if (state.over || state.cells[index]) return;
        state.cells[index] = state.turn;
        const line = winner();
        if (line) {
          state.over = true;
          state.wins[state.turn] += 1;
          status.textContent = `${state.turn === "one" ? "One" : "Two"} ganó la ronda.`;
          recordScore("tateti", 300 + state.wins.one * 50 + state.wins.two * 50, { label: "Tatetí Numberblocks" }).catch(() => {});
        } else if (!state.cells.includes("")) {
          state.over = true;
          status.textContent = "Empate técnico.";
        } else {
          state.turn = state.turn === "one" ? "two" : "one";
          status.textContent = `Sigue ${state.turn === "one" ? "One" : "Two"}.`;
        }
        draw();
      }

      resetButton.addEventListener("click", () => {
        state.cells = Array(9).fill("");
        state.turn = "one";
        state.over = false;
        status.textContent = "Toca una casilla para empezar.";
        draw();
      });

      draw();
    </script>
  </body>
</html>
